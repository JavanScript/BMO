services:
  bmo-web:
    user: "${BMO_UID:-1000}:${BMO_GID:-1000}"
    build:
      context: .
      dockerfile: bmo-web/Dockerfile
      args:
        PYTHON_IMAGE: ${BMO_PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    environment:
      BMO_SHARED_SECRET: ${BMO_SHARED_SECRET:-change-me}
      BMO_PUBLIC_BASE_URL: ${BMO_PUBLIC_BASE_URL:-http://localhost:8000}
      BMO_DB_PATH: /data/bmo-web.sqlite3
      GAME_PLUGINS_DIR: /data/plugins
      BMO_ENABLE_PLUGIN_UPLOADS: ${BMO_ENABLE_PLUGIN_UPLOADS:-0}
      ADMIN_PASSWORD: ${BMO_ADMIN_PASSWORD:-}
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data/bmo-web:/data

  bmo-plugin-build:
    image: dock.mau.dev/maubot/maubot:latest
    user: "${BMO_UID:-1000}:${BMO_GID:-1000}"
    environment:
      HOME: /tmp
    profiles:
      - tools
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /workspace/dist && mbc build /workspace/bmo-plugin -o /workspace/dist/dev.bmo.games.mbp"]
    volumes:
      - ./:/workspace
