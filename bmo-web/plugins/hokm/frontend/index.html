<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMO Hokm</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, sans-serif;
      background: #081423;
      color: #e7eef8;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #081423;
    }
    main {
      width: min(1240px, calc(100vw - 24px));
      margin: 0 auto;
      padding: 18px 0 28px;
      min-width: 0;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }
    h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
    }
    button {
      min-height: 40px;
      border: 1px solid rgba(247, 240, 223, .34);
      border-radius: 7px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .badge {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(247, 240, 223, .2);
      border-radius: 999px;
      padding: 5px 10px;
      background: rgba(15, 31, 52, .72);
      color: #c9d7ea;
      font-size: 13px;
      font-weight: 700;
    }
    .badge.hot {
      background: #f0b84d;
      border-color: #f0b84d;
      color: #081423;
    }
    .identity {
      color: #aebed4;
      overflow-wrap: anywhere;
      text-align: right;
      font-size: 14px;
    }
    .game-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 14px;
      align-items: start;
      min-width: 0;
    }
    .felt {
      min-height: 590px;
      border: 1px solid rgba(247, 240, 223, .2);
      border-radius: 8px;
      background: #0c1b2d;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .05),
        0 14px 36px rgba(0, 0, 0, .22);
      padding: 18px;
      min-width: 0;
      overflow: hidden;
    }
    .table-grid {
      min-height: 360px;
      display: grid;
      grid-template-columns: 185px minmax(250px, 1fr) 185px;
      grid-template-rows: 116px minmax(170px, 1fr) 122px;
      gap: 12px;
      align-items: stretch;
      min-width: 0;
    }
    .seat {
      min-width: 0;
      border: 1px solid rgba(247, 240, 223, .18);
      border-radius: 8px;
      background: rgba(45, 68, 104, .38);
      padding: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .03);
      overflow: hidden;
    }
    .seat.current {
      border-color: #f0b84d;
      box-shadow: 0 0 0 2px rgba(240, 184, 77, .34);
    }
    .seat.viewer {
      background: rgba(75, 126, 190, .22);
    }
    .seat.top {
      grid-column: 2;
      grid-row: 1;
    }
    .seat.left {
      grid-column: 1;
      grid-row: 2;
    }
    .seat.right {
      grid-column: 3;
      grid-row: 2;
    }
    .seat.bottom {
      grid-column: 2;
      grid-row: 3;
    }
    .seat-name {
      color: #f4f8ff;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .seat-id {
      color: #9eb0c8;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .seat-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      border-radius: 999px;
      padding: 3px 8px;
      background: rgba(8, 20, 35, .72);
      color: #c9d7ea;
      font-size: 12px;
      font-weight: 800;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tag.hakem {
      background: #f0b84d;
      color: #081423;
    }
    .tag.turn {
      background: #64d2ff;
      color: #061220;
    }
    .table-center {
      grid-column: 2;
      grid-row: 2;
      min-width: 0;
      border: 1px solid rgba(201, 215, 234, .2);
      border-radius: 8px;
      background: rgba(5, 15, 29, .68);
      padding: 14px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
    }
    .center-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      min-width: 0;
    }
    .status {
      min-width: 0;
      color: #f0b84d;
      font-weight: 900;
      overflow-wrap: anywhere;
    }
    .trump-mark {
      min-width: 56px;
      text-align: center;
      border-radius: 8px;
      background: #dce8f7;
      color: #081423;
      padding: 8px;
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
    }
    .trick {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-content: center;
    }
    .play {
      min-height: 82px;
      border: 1px dashed rgba(201, 215, 234, .24);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #c9d7ea;
      min-width: 0;
    }
    .play.winner {
      border-style: solid;
      border-color: #f0b84d;
      box-shadow: 0 0 0 1px rgba(240, 184, 77, .25);
    }
    .play .name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }
    .mini-card {
      width: 46px;
      height: 64px;
      border-radius: 7px;
      border: 1px solid #cbd7e6;
      background: #f8fbff;
      color: #081423;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 900;
      flex: 0 0 auto;
      box-shadow: 0 5px 12px rgba(0, 0, 0, .2);
    }
    .mini-card.red {
      color: #b62438;
    }
    .trump-panel {
      display: none;
      border-top: 1px solid rgba(201, 215, 234, .16);
      padding-top: 12px;
    }
    .trump-panel.active {
      display: block;
    }
    .trump-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .trump-buttons button {
      min-width: 0;
      min-height: 54px;
      background: #dce8f7;
      color: #081423;
      font-size: 24px;
      font-weight: 900;
    }
    .trump-buttons button.red {
      color: #b62438;
    }
    .hand-wrap {
      margin-top: 18px;
      min-width: 0;
      max-width: 100%;
    }
    .hand-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }
    .hand {
      min-height: 148px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      padding: 2px 2px 12px;
      scroll-snap-type: x proximity;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      -webkit-overflow-scrolling: touch;
    }
    .card {
      width: clamp(68px, 7vw, 88px);
      min-width: clamp(68px, 7vw, 88px);
      flex: 0 0 clamp(68px, 7vw, 88px);
      aspect-ratio: 5 / 7;
      background: #f8fbff;
      color: #081423;
      border: 1px solid #cbd7e6;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 9px;
      font-weight: 900;
      scroll-snap-align: start;
      transition: transform .14s ease, box-shadow .14s ease, opacity .14s ease;
    }
    .card.playable {
      transform: translateY(-6px);
      border-color: #f0b84d;
      box-shadow: 0 10px 18px rgba(240, 184, 77, .28);
    }
    .card.red {
      color: #b62438;
    }
    .card span {
      align-self: flex-start;
      font-size: 18px;
    }
    .card strong {
      align-self: center;
      font-size: 34px;
      line-height: 1;
    }
    .side-panel {
      border: 1px solid rgba(247, 240, 223, .2);
      border-radius: 8px;
      background: rgba(15, 31, 52, .72);
      padding: 14px;
      margin-bottom: 12px;
    }
    .team {
      border: 1px solid rgba(247, 240, 223, .13);
      border-radius: 8px;
      background: rgba(45, 68, 104, .32);
      padding: 10px;
      margin-top: 10px;
    }
    .team.active {
      border-color: rgba(240, 184, 77, .95);
    }
    .players {
      color: #c9d7ea;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.45;
      margin-top: 6px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      color: #e7eef8;
      font-weight: 700;
    }
    .log {
      color: #c9d7ea;
      line-height: 1.45;
      min-height: 44px;
      overflow-wrap: anywhere;
    }
    .message {
      color: #f0b84d;
      font-weight: 700;
    }
    .empty {
      min-height: 120px;
      display: grid;
      place-items: center;
      border: 1px dashed rgba(201, 215, 234, .22);
      border-radius: 8px;
      color: #9eb0c8;
    }
    .danger {
      color: #ffb7c0;
    }
    @media (max-width: 900px) {
      .game-shell {
        grid-template-columns: 1fr;
      }
      .felt {
        min-height: 0;
      }
    }
    @media (max-width: 720px) {
      body {
        min-height: 100dvh;
        background: #081423;
      }
      main {
        width: 100%;
        padding: 8px 8px 12px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: block;
        margin: 0 -8px 8px;
        padding: 8px 8px 10px;
        background: #081423;
        border-bottom: 1px solid rgba(201, 215, 234, .14);
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 14px;
      }
      .status-line {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .badge {
        min-height: 28px;
        justify-content: center;
        padding: 4px 7px;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .identity {
        text-align: left;
        margin-top: 6px;
        font-size: 12px;
      }
      .game-shell {
        gap: 10px;
      }
      .felt {
        min-height: 0;
        padding: 10px;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }
      .table-grid {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(64px, .72fr) minmax(128px, 1.36fr)
          minmax(64px, .72fr);
        grid-template-rows: 68px minmax(160px, auto) 74px;
        gap: 6px;
      }
      .seat.top,
      .seat.left,
      .seat.right,
      .seat.bottom {
        min-height: 0;
        padding: 8px;
      }
      .seat.top {
        grid-column: 2;
        grid-row: 1;
      }
      .seat.left {
        grid-column: 1;
        grid-row: 2;
      }
      .seat.right {
        grid-column: 3;
        grid-row: 2;
      }
      .seat.bottom {
        grid-column: 2;
        grid-row: 3;
      }
      .table-center {
        grid-column: 2;
        grid-row: 2;
        min-height: 0;
        padding: 10px;
        gap: 8px;
      }
      .seat-name {
        font-size: 14px;
      }
      .seat-id {
        display: none;
      }
      .seat-tags {
        gap: 4px;
      }
      .tag {
        padding: 3px 6px;
        font-size: 11px;
      }
      .center-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 44px;
        align-items: start;
      }
      .status {
        font-size: 15px;
        line-height: 1.25;
      }
      .trump-mark {
        min-width: 48px;
        font-size: 24px;
        padding: 7px;
      }
      .trick {
        gap: 6px;
      }
      .play {
        min-height: 48px;
        justify-content: center;
        padding: 5px;
      }
      .play .name {
        display: none;
      }
      .mini-card {
        width: 34px;
        height: 46px;
        font-size: 15px;
        border-radius: 6px;
      }
      .trump-buttons {
        grid-template-columns: repeat(2, 1fr);
      }
      .trump-buttons button {
        min-height: 48px;
      }
      .hand-wrap {
        position: sticky;
        bottom: 0;
        z-index: 4;
        margin: 10px 0 0;
        padding: 10px 0 6px;
        background: #0c1b2d;
        border-top: 1px solid rgba(201, 215, 234, .16);
        overflow: hidden;
      }
      .hand-head {
        margin-bottom: 8px;
      }
      .hand {
        min-height: 118px;
        gap: 7px;
        padding-bottom: 8px;
      }
      .card {
        width: 64px;
        min-width: 64px;
        flex-basis: 64px;
        padding: 7px;
      }
      .card span {
        font-size: 16px;
      }
      .card strong {
        font-size: 30px;
      }
      .card.playable {
        transform: translateY(-4px);
      }
      .side-panel {
        margin-bottom: 8px;
        padding: 10px;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }
      .team {
        padding: 8px;
      }
      .players,
      .stats,
      .log {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div>
        <h1>Hokm / حکم</h1>
        <div class="status-line">
          <span id="phase-badge" class="badge">Loading</span>
          <span id="turn-badge" class="badge">Turn</span>
          <span id="trump-badge" class="badge">Trump</span>
        </div>
      </div>
      <div id="identity" class="identity"></div>
    </div>

    <div class="game-shell">
      <section class="felt">
        <div class="table-grid">
          <div id="seat-top" class="seat top"></div>
          <div id="seat-left" class="seat left"></div>
          <div id="seat-right" class="seat right"></div>
          <div id="seat-bottom" class="seat bottom"></div>
          <div class="table-center">
            <div class="center-top">
              <div id="status" class="status">Loading...</div>
              <div id="trump-mark" class="trump-mark">?</div>
            </div>
            <div class="trick" id="current-trick"></div>
            <div id="trump-panel" class="trump-panel">
              <h2>Trump / حکم</h2>
              <div id="trump-buttons" class="trump-buttons"></div>
            </div>
          </div>
        </div>

        <div class="hand-wrap">
          <div class="hand-head">
            <h2>Your hand / دست شما</h2>
            <span id="hand-count" class="badge">0 cards</span>
          </div>
          <div id="hand" class="hand"></div>
        </div>
      </section>

      <aside>
        <div class="side-panel">
          <h2>Teams / تیم‌ها</h2>
          <div id="teams"></div>
        </div>
        <div class="side-panel">
          <h2>Table / میز</h2>
          <div id="meta" class="log"></div>
        </div>
        <div class="side-panel">
          <h2>Last hand / دست قبلی</h2>
          <div id="last-hand" class="log"></div>
        </div>
        <div class="side-panel">
          <h2>Message / پیام</h2>
          <div id="message" class="log message"></div>
        </div>
      </aside>
    </div>
  </main>
  <script>
    const sessionId = __SESSION_JSON__;
    const params = new URLSearchParams(window.location.search);
    const playerId = params.get("player_id") || "";
    const token = params.get("token") || "";
    const authQuery = new URLSearchParams({ player_id: playerId, token });
    const statusEl = document.querySelector("#status");
    const identityEl = document.querySelector("#identity");
    const phaseBadge = document.querySelector("#phase-badge");
    const turnBadge = document.querySelector("#turn-badge");
    const trumpBadge = document.querySelector("#trump-badge");
    const trumpMark = document.querySelector("#trump-mark");
    const teamsEl = document.querySelector("#teams");
    const metaEl = document.querySelector("#meta");
    const lastHandEl = document.querySelector("#last-hand");
    const messageEl = document.querySelector("#message");
    const trumpPanel = document.querySelector("#trump-panel");
    const trumpButtons = document.querySelector("#trump-buttons");
    const trickEl = document.querySelector("#current-trick");
    const handEl = document.querySelector("#hand");
    const handCountEl = document.querySelector("#hand-count");
    const seatEls = {
      top: document.querySelector("#seat-top"),
      right: document.querySelector("#seat-right"),
      bottom: document.querySelector("#seat-bottom"),
      left: document.querySelector("#seat-left"),
    };

    function teamName(id) {
      return `Team ${Number(id) + 1}`;
    }

    function shortName(player) {
      return (player || "").replace(/^@/, "").split(":")[0] || player || "";
    }

    function displayName(data, player) {
      return (data.display_names || {})[player] || shortName(player);
    }

    function teamFor(data, player) {
      return (data.teams || []).find((team) => team.players.includes(player));
    }

    function positionedSeats(data) {
      const seats = data.seats || [];
      if (seats.length !== 4) return {};
      const viewerIndex = seats.indexOf(data.player_id);
      if (viewerIndex === -1) {
        return {
          top: seats[0],
          right: seats[1],
          bottom: seats[2],
          left: seats[3],
        };
      }
      return {
        bottom: seats[viewerIndex],
        right: seats[(viewerIndex + 1) % 4],
        top: seats[(viewerIndex + 2) % 4],
        left: seats[(viewerIndex + 3) % 4],
      };
    }

    function node(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function render(data) {
      identityEl.textContent = data.player_id
        ? `Playing as ${displayName(data, data.player_id)}`
        : "";
      statusEl.classList.remove("danger");
      renderStatus(data);
      renderSeats(data);
      renderTeams(data.teams || []);
      renderMeta(data);
      renderTrumpControls(data);
      renderTrick(data);
      renderHand(data.hand || [], new Set(data.playable_card_ids || []));
      renderLastHand(data.last_hand);
    }

    function renderStatus(data) {
      phaseBadge.textContent = data.phase === "choose_trump"
        ? "Trump / حکم"
        : data.phase === "finished"
          ? "Finished"
          : `Hand ${data.hand_number}`;
      phaseBadge.classList.toggle("hot", data.phase === "choose_trump");
      turnBadge.textContent = data.current_turn
        ? `Turn: ${displayName(data, data.current_turn)}`
        : "Turn";
      turnBadge.classList.toggle("hot", data.current_turn === data.player_id);
      trumpBadge.textContent = data.trump_symbol
        ? `Trump ${data.trump_symbol}`
        : "Trump ?";
      trumpBadge.classList.toggle("hot", Boolean(data.trump_symbol));
      trumpMark.textContent = data.trump_symbol || "?";

      if (data.phase === "finished") {
        statusEl.textContent = `${teamName(data.winner_team)} wins the match.`;
      } else if (data.phase === "choose_trump") {
        statusEl.textContent = data.can_choose_trump
          ? "Choose trump / حکم را انتخاب کنید"
          : `Waiting for Hâkem / حاکم: ${displayName(data, data.hakem)}`;
      } else if (data.current_turn === data.player_id) {
        statusEl.textContent = "Your turn / نوبت شما";
      } else {
        statusEl.textContent = `Turn / نوبت: ${displayName(data, data.current_turn)}`;
      }
    }

    function renderSeats(data) {
      const positions = positionedSeats(data);
      for (const [position, player] of Object.entries(positions)) {
        const seat = seatEls[position];
        const team = teamFor(data, player);
        seat.className = `seat ${position}`;
        seat.classList.toggle("current", player === data.current_turn);
        seat.classList.toggle("viewer", player === data.player_id);

        const main = node("div");
        main.append(
          node("div", "seat-name", displayName(data, player)),
          node("div", "seat-id", player)
        );

        const tags = node("div", "seat-tags");
        if (team) tags.append(node("span", "tag", teamName(team.id)));
        if (player === data.hakem) {
          tags.append(node("span", "tag hakem", "Hâkem / حاکم"));
        }
        if (player === data.current_turn) {
          tags.append(node("span", "tag turn", "Turn"));
        }
        seat.replaceChildren(main, tags);
      }
    }

    let lastDisplayNames = {};

    function renderTeams(teams) {
      teamsEl.replaceChildren(...teams.map((team) => {
        const item = node("div", `team${team.is_hakem_team ? " active" : ""}`);
        const title = node(
          "strong",
          "",
          `${team.name}${team.is_hakem_team ? " · Hâkem" : ""}`
        );
        const players = node("div", "players", team.players.map((p) => lastDisplayNames[p] || shortName(p)).join(" / "));
        const stats = node("div", "stats", `Score ${team.score} · Tricks ${team.tricks}`);
        item.append(title, players, stats);
        return item;
      }));
    }

    function renderMeta(data) {
      lastDisplayNames = data.display_names || {};
      const trump = data.trump_symbol ? data.trump_symbol : "not chosen";
      metaEl.textContent =
        `Hand ${data.hand_number} · Hâkem / حاکم: ${displayName(data, data.hakem)}` +
        ` · Trump / حکم: ${trump}`;
    }

    function renderTrumpControls(data) {
      trumpPanel.classList.toggle("active", data.phase === "choose_trump");
      trumpButtons.replaceChildren();
      if (data.phase !== "choose_trump") return;
      for (const option of data.trump_options || []) {
        const button = node("button", ["hearts", "diamonds"].includes(option.suit)
          ? "red"
          : "");
        button.textContent = option.symbol;
        button.disabled = !data.can_choose_trump;
        button.addEventListener("click", () => {
          sendAction("choose_trump", { suit: option.suit });
        });
        trumpButtons.append(button);
      }
    }

    function visibleTrick(data) {
      const current = data.current_trick || [];
      if (current.length) {
        return { plays: current, winner: "" };
      }
      const last = data.last_trick || {};
      return { plays: last.cards || [], winner: last.winner || "" };
    }

    function renderTrick(data) {
      const { plays, winner } = visibleTrick(data);
      const byPlayer = new Map(plays.map((play) => [play.player_id, play]));
      const positions = positionedSeats(data);
      const cells = ["top", "right", "bottom", "left"].map((position) => {
        const player = positions[position];
        const play = byPlayer.get(player);
        const cell = node("div", `play${player === winner ? " winner" : ""}`);
        cell.append(node("span", "name", displayName(data, player)));
        if (play) {
          cell.append(node("div", `mini-card ${play.card.color}`, play.card.label));
        } else {
          cell.append(node("div", "mini-card", "·"));
        }
        return cell;
      });
      trickEl.replaceChildren(...cells);
    }

    function renderHand(cards, playable) {
      handCountEl.textContent = `${cards.length} card${cards.length === 1 ? "" : "s"}`;
      if (!cards.length) {
        handEl.replaceChildren(node("div", "empty", "Waiting for deal"));
        return;
      }
      handEl.replaceChildren(...cards.map((card) => {
        const isPlayable = playable.has(card.id);
        const button = node("button", `card ${card.color}${isPlayable ? " playable" : ""}`);
        button.disabled = !isPlayable;
        button.append(node("span", "", card.rank), node("strong", "", card.symbol));
        button.addEventListener("click", () => {
          sendAction("play_card", { card: card.id });
        });
        return button;
      }));
    }

    function renderLastHand(lastHand) {
      if (!lastHand) {
        lastHandEl.textContent = "No completed hand.";
        return;
      }
      lastHandEl.textContent =
        `${teamName(lastHand.winner_team)} · ${lastHand.result}` +
        ` · +${lastHand.points}`;
    }

    async function sendAction(action, payload) {
      const res = await fetch(`/api/sessions/${sessionId}/actions?${authQuery}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, payload }),
      });
      const data = await res.json();
      messageEl.textContent = data.error || data.message || "";
      if (data.session) render(data.session);
    }

    async function refresh() {
      if (!playerId || !token) {
        statusEl.textContent = "Open your signed player link from Matrix.";
        phaseBadge.textContent = "Signed link";
        turnBadge.textContent = "Waiting";
        trumpBadge.textContent = "Trump ?";
        return;
      }
      const res = await fetch(`/api/sessions/${sessionId}?${authQuery}`);
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = data.error || "Could not load game.";
        statusEl.classList.add("danger");
        return;
      }
      render(data);
    }

    function connectEvents() {
      if (!playerId || !token) return;
      const events = new EventSource(`/api/sessions/${sessionId}/events?${authQuery}`);
      events.addEventListener("state", (event) => {
        render(JSON.parse(event.data));
      });
    }

    refresh();
    connectEvents();
  </script>
</body>
</html>
